name: release

# Manual, not tag-triggered. A tag push publishes whatever the tag points at; a dispatch makes
# someone choose the dist-tag deliberately, and the `npm` environment is where a required
# reviewer or a branch rule hangs if this ever needs one.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag to publish under"
        required: true
        default: rc
        type: choice
        options: [rc, latest]

# `pnpm install` runs `prepare`, which installs lefthook's git hooks. In CI that means any
# step doing a `git push` runs the whole pre-push suite — the checks this workflow already
# runs as explicit jobs, against a checkout that may not have built yet. Hooks are for a
# developer's machine.
env:
  LEFTHOOK: "0"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The `npm` environment restricts deploys to `main` and records each publish under the
    # repository's Environments tab, so a release is announced rather than buried in a job log.
    # A required reviewer hangs here too, if one is ever wanted.
    environment:
      name: npm
      url: https://www.npmjs.com/org/nubbin
    permissions:
      # OIDC. Trusted publishing exchanges this for a short-lived credential scoped to this
      # workflow, so no npm token is stored anywhere. Also what --provenance signs with.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm >= 11.5.1. The pinned Node ships one, but checking here
      # makes a silent downgrade fail with the reason rather than at the publish step.
      - name: Check npm supports trusted publishing
        run: |
          set -euo pipefail
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) throw new Error(`npm ${process.argv[1]} is below the 11.5.1 trusted publishing floor`);
          ' "$(npm --version)"

      - name: Refuse a stable release of a prerelease version
        if: inputs.tag == 'latest'
        run: pnpm release-tag

      - name: Build and prove the artifacts are publishable
        run: pnpm publishable

      # `changeset publish` rather than a hand-rolled loop: it already skips a version
      # already on the registry, reads the dist-tag from prerelease mode, and is what
      # `.changeset/config.json` was configured for. It shells out to `pnpm publish`, so the
      # `catalog:` and `workspace:*` rewriting still happens — npm cannot do that itself.
      #
      # Reading the tag from prerelease mode is exactly why `--tag` must not be passed while
      # that mode is active: changesets treats the two as a conflict and exits 1 with
      # "Releasing under custom tag is not allowed in pre mode!". So the input is checked
      # against `.changeset/pre.json` and then dropped, rather than forwarded.
      #
      # NPM_CONFIG_PROVENANCE reaches npm through both layers of delegation, which is the one
      # part of this path not yet observed in a real run.
      - name: Publish
        run: |
          set -euo pipefail
          if [ -f .changeset/pre.json ]; then
            pre_tag=$(node -p "require('./.changeset/pre.json').tag")
            if [ "$pre_tag" != "$TAG" ]; then
              echo "::error::Pre mode publishes under '$pre_tag', but this run asked for '$TAG'. Dispatch with tag=$pre_tag, or leave pre mode first with 'pnpm changeset pre exit'." >&2
              exit 1
            fi
            pnpm changeset publish
          else
            pnpm changeset publish --tag "$TAG"
          fi
        env:
          TAG: ${{ inputs.tag }}
          NPM_CONFIG_PROVENANCE: "true"

      # The publish output is not the evidence — the registry is. This reads back what a
      # consumer would resolve, and fails the run if a package did not land.
      - name: Verify against the registry
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            npm view "$name@$version" version
            echo "$name dist-tags: $(npm view "$name" dist-tags --json | tr -d '\n')" >> "$GITHUB_STEP_SUMMARY"
          done
