name: release

# Two jobs, and the second only runs when the first says a release was created.
#
# The predecessor was `workflow_dispatch`, which meant a human chose a ref and a dist-tag and the
# workflow published whatever was there. Five dispatches on 2026-08-17 all targeted `0.1.0-rc.4`
# from four different commits; one landed and the other three reported success having published
# nothing, because the publisher skips a version already on the registry and exits 0. npm's
# immutability was the only thing keeping four different builds from shipping under one version.
#
# So the version is no longer a thing anyone chooses. release-please derives it from the
# conventional commits since the last release, opens a pull request that carries the bump and the
# changelogs, and creates the GitHub releases when that pull request merges. `releases_created` is
# true only on the run that created them — which is once per version, ever. That output is the
# republish prevention, and nothing else in this file is.
on:
  push:
    branches: [main]

# `pnpm install` runs `prepare`, which installs lefthook's git hooks. In CI that means any step
# doing a `git push` runs the whole pre-push suite — the checks this workflow already runs as
# explicit jobs, against a checkout that may not have built yet. Hooks are for a developer's
# machine.
env:
  LEFTHOOK: "0"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      # `GITHUB_TOKEN` cannot do this job, for two independent reasons, and both fail in ways that
      # read like something else. This repository has "Allow GitHub Actions to create and approve
      # pull requests" off, so the token cannot open the release pull request at all. And a pull
      # request opened by `GITHUB_TOKEN` triggers no workflow run, so `verify` and `commitlint` —
      # both required status checks — would never report on it and it could never be merged.
      #
      # Naming the secret rather than assuming it: an unset one would otherwise surface as an
      # authentication error against an action nobody suspects.
      - name: Require the release-please token
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set. It is a fine-grained personal access token with Contents: read and write, Pull requests: read and write, and Issues: read and write on this repository. docs/releasing.md says why GITHUB_TOKEN cannot stand in for it." >&2
            exit 1
          fi

      # SHA-pinned because `.github/zizmor.yml` requires a full commit SHA for every publisher
      # except `actions/*`: a third party can move a tag under us. This is v5.0.0.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # A string comparison, not the bare truthiness form. The action sets this output through
    # `@actions/core`, which stringifies — so the value is the string `'false'` when nothing was
    # released, and `if: needs...outputs.releases_created` would be true for it.
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    # The `npm` environment restricts deployments to `main`, carries a required reviewer, and
    # records each publish under the repository's Environments tab. Merging the release pull
    # request proposes a release; approving here is what performs one.
    environment:
      name: npm
      url: https://www.npmjs.com/org/nubbin
    permissions:
      # OIDC. Trusted publishing exchanges this for a short-lived credential scoped to this
      # workflow, so no npm token is stored anywhere. Also what --provenance signs with.
      id-token: write
      contents: read
      # For reading the `verify` run's conclusion on this commit.
      actions: read
    steps:
      - uses: actions/checkout@v7

      # The gap this closes: nothing here ever asked whether the code being published passes the
      # suite. `pnpm publishable` below builds and checks the artifact, but it does not run the
      # tests, the typecheck or the lint — so a commit that fails all three could publish.
      #
      # It waits rather than reading once, because `verify` and this workflow are triggered by the
      # same push and start together.
      - name: Require verify to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          while :; do
            json=$(gh api "repos/$REPO/actions/workflows/verify.yml/runs?head_sha=$SHA&per_page=1")
            status=$(jq -r '.workflow_runs[0].status // "missing"' <<<"$json")
            conclusion=$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$json")
            if [ "$status" = "missing" ]; then
              echo "::error::No verify run for $SHA. This workflow publishes only what verify has passed." >&2
              exit 1
            fi
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "verify succeeded for $SHA"
                break
              fi
              echo "::error::verify concluded '$conclusion' for $SHA. Nothing is published from a commit that did not pass it." >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::verify is still '$status' for $SHA after 30 minutes." >&2
              exit 1
            fi
            sleep 20
          done

      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      # actions/setup-node survives here and in no other workflow. `registry-url` writes the
      # .npmrc that trusted publishing authenticates through, and pnpm/setup has no equivalent
      # input; the steps below also shell out to `npm` directly — for the 11.5.1 floor, for
      # `npm view`, and for `npm dist-tag add`. Ordering it after pnpm/setup puts its Node, and
      # the npm bundled with it, ahead on PATH.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm >= 11.5.1. The pinned Node ships one, but checking here
      # makes a silent downgrade fail with the reason rather than at the publish step.
      - name: Check npm supports trusted publishing
        run: |
          set -euo pipefail
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) throw new Error(`npm ${process.argv[1]} is below the 11.5.1 trusted publishing floor`);
          ' "$(npm --version)"

      - name: Build and prove the artifacts are publishable
        run: pnpm publishable

      # The dist-tag is derived from the version rather than chosen, because a choice is what
      # produced a release candidate sitting on `latest`. A prerelease publishes to `rc`; a stable
      # version publishes to `latest`, and `pnpm release-tag` is the assertion that the second case
      # really is stable.
      #
      # The registry is read first because both `pnpm publish` and its predecessor skip a version
      # already on it and exit 0 — that is the behaviour under which one version reported four
      # successful publishes. Here it is a red build with the version named.
      - name: Refuse a version the registry already has
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/core/package.json').version")
          case "$version" in
            *-*) tag=rc ;;
            *)   tag=latest ;;
          esac
          if [ "$tag" = "latest" ]; then pnpm release-tag; fi
          published=0
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::error::$name@$version is already on the registry. Publishing it again would either be a no-op reported as success, or a different build under a version consumers already have." >&2
              published=$((published + 1))
            fi
          done
          [ "$published" -eq 0 ]
          echo "NPM_DIST_TAG=$tag" >> "$GITHUB_ENV"
          echo "NUBBIN_VERSION=$version" >> "$GITHUB_ENV"

      # pnpm rather than npm: workspace dependencies are written `catalog:` and `workspace:*`, and
      # pnpm rewrites them to real versions when it packs. npm cannot, and publishes a manifest
      # that fails on install for every consumer.
      #
      # NPM_CONFIG_PROVENANCE reaches npm through pnpm's delegation to `npm publish` — the
      # attestation on `0.1.0-rc.4` was produced through this same path.
      - name: Publish
        run: pnpm --filter "./packages/*" publish --tag "$NPM_DIST_TAG" --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # The publish output is not the evidence — the registry is. This reads back what a
      # consumer would resolve, and fails the run if a package did not land.
      #
      # It retries, because a successful publish is not immediately readable: the first run of
      # this step reported `E404 No match found for version 0.1.0-rc.4` for `@nubbin/next`
      # seconds after all four had in fact published. Reading once turns registry propagation
      # into a red build and invites someone to re-run a publish that already succeeded.
      - name: Verify against the registry
        run: |
          set -euo pipefail
          attempts=10
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            for attempt in $(seq 1 "$attempts"); do
              if npm view "$name@$NUBBIN_VERSION" version >/dev/null 2>&1; then
                echo "$name@$NUBBIN_VERSION is readable (attempt $attempt)"
                break
              fi
              if [ "$attempt" -eq "$attempts" ]; then
                echo "::error::$name@$NUBBIN_VERSION never became readable after $attempts attempts" >&2
                exit 1
              fi
              sleep 6
            done
            echo "$name dist-tags: $(npm view "$name" dist-tags --json | tr -d '\n')" >> "$GITHUB_STEP_SUMMARY"
          done

      # `latest` is the tag a plain `npm install` resolves, and it sat on `0.1.0-rc.4` for months
      # because the previous publisher sent a package with no prior stable release there whatever
      # `--tag` said. Publishing with an explicit `--tag rc` does not move it, so this step exists
      # for the stable case only — and reports rather than fails, because a release that published
      # correctly must not go red over a tag.
      - name: Move the dist-tag to the version just published
        if: success()
        continue-on-error: true
        run: |
          set -uo pipefail
          moved=0
          failed=0
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            current=$(npm view "$name" "dist-tags.$NPM_DIST_TAG" 2>/dev/null || echo "")
            if [ "$current" = "$NUBBIN_VERSION" ]; then
              echo "$name: '$NPM_DIST_TAG' already at $NUBBIN_VERSION"
              continue
            fi
            if npm dist-tag add "$name@$NUBBIN_VERSION" "$NPM_DIST_TAG" 2>/dev/null; then
              echo "$name: '$NPM_DIST_TAG' moved $current -> $NUBBIN_VERSION"
              moved=$((moved + 1))
            else
              echo "::warning::$name: could not move '$NPM_DIST_TAG' from '$current' to $NUBBIN_VERSION. Run: npm dist-tag add $name@$NUBBIN_VERSION $NPM_DIST_TAG"
              failed=$((failed + 1))
            fi
          done
          {
            echo "### dist-tag \`$NPM_DIST_TAG\`"
            echo ""
            echo "moved: $moved · could not move: $failed"
          } >> "$GITHUB_STEP_SUMMARY"
