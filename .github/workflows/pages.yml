name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# `pnpm install` runs `prepare`, which installs lefthook's git hooks. They are for a
# developer's machine; the gates this repository runs in CI are jobs, not hooks.
env:
  LEFTHOOK: "0"

# Pages serves one deployment at a time, so publishes queue rather than race, and a
# running one is never cancelled: the site it is mid-way through writing is the live one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # No `paths:` filter. The site renders the documents, the workspace and the lockfile,
  # and a filter listing those goes stale the first time an input moves — where the
  # failure is a site that silently stops updating.
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `onBrokenLinks: throw` makes this the gate on every link between documents.
      - name: Build the site
        run: pnpm --filter docs-site run build

      # `enablement` moves Pages from serving a branch to serving this workflow's
      # artifact. Declaring it here rather than setting it once by hand keeps the
      # publishing path in the repository, where a reader can see it.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

      - id: deploy
        uses: actions/deploy-pages@v5
