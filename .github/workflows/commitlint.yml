name: commit messages

on: pull_request

jobs:
  commitlint:
    # Dependabot's subject line is fixed by the tool ("Bump x from 4 to 7") and trips
    # config-conventional's subject-case rule. Its scope is already constrained by the
    # commit-message prefix in dependabot.yml, so there is nothing left here to check.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # install: false because the install below is deliberate, not the default one.
      - uses: pnpm/setup@v2
        with:
          install: false

      # Installed with pnpm, not npm: devDependencies use the `catalog:` protocol, which
      # npm rejects outright ("Unsupported URL Type"). No --frozen-lockfile and no
      # `cache: true` until a lockfile exists — both require one. --ignore-scripts because
      # nothing here needs to build, and lifecycle scripts are the supply-chain surface
      # .claude/rules/dependencies.md exists to keep small.
      - name: Install
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Lint commits in this PR
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
