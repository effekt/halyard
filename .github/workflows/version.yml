name: version

# Opens and maintains a "Version Packages" pull request. Versions and changelogs are generated
# from the changeset files a contributor writes, never edited by hand — a hand-set version is
# how `0.1.0-rc.0` shipped with no changelog and no record of what changed.
on:
  push:
    branches: [main]

# `pnpm install` runs `prepare`, which installs lefthook's git hooks. In CI that means any
# step doing a `git push` runs the whole pre-push suite — the checks this workflow already
# runs as explicit jobs, against a checkout that may not have built yet. Hooks are for a
# developer's machine.
env:
  LEFTHOOK: "0"

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Apply changesets
        run: pnpm changeset version

      # Plain git rather than changesets/action. In prerelease mode that action reads
      # `.changeset/pre/changes.md`, which changesets does not write — every run failed with
      # ENOENT. Its other job, opening the pull request, is blocked by a repository setting
      # anyway, so what remains is a branch push that git does directly.
      - name: Push the version branch
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changesets to apply." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B changeset-release/main
          git add -A
          git commit -m "chore(repo): version packages"
          git push --force origin changeset-release/main
          {
            echo "Pushed \`changeset-release/main\`. Open a pull request from it to apply:"
            echo ""
            for dir in packages/*/; do
              [ -f "$dir/package.json" ] || continue
              node -p "const m=require('./$dir/package.json'); \`- \${m.name} → \${m.version}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
