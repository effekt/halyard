name: verify

on:
  pull_request:
  push:
    branches: [main]

# `pnpm install` runs `prepare`, which installs lefthook's git hooks. In CI that means any
# step doing a `git push` runs the whole pre-push suite — the checks this workflow already
# runs as explicit jobs, against a checkout that may not have built yet. Hooks are for a
# developer's machine.
env:
  LEFTHOOK: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every gate here is plain Node with no dependencies, so it runs against a bare
  # checkout with no install step and no lockfile.
  #
  # check-schema-depth and check-single-export are absent despite also being scripts:
  # both import `typescript`, so they run in the code job below alongside the gates
  # that need node_modules.
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check-stale-docs compares commit times across link edges, so it needs history.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Documentation structure
        run: node scripts/check-docs.mjs --check

      - name: Prose
        run: node scripts/check-prose.mjs --check

      - name: Prose duplication
        run: node scripts/check-prose-dupes.mjs --check

      - name: Plan files
        run: node scripts/check-plan-files.mjs --check

      - name: Accessibility
        run: node scripts/check-a11y.mjs --check

      - name: Rule files
        run: node scripts/check-rules.mjs --check

      - name: Pinned dependencies
        run: node scripts/check-pinned-deps.mjs --check

      - name: Junk-drawer filenames
        run: node scripts/check-structure.mjs --check

      # Advisory: a document trailing something it links to is worth re-reading,
      # not worth failing a build over.
      - name: Stale documents
        run: node scripts/check-stale-docs.mjs
        continue-on-error: true

  # Everything needing an install: lint, typecheck, tests, build, structure gates,
  # package boundaries, duplication, and dead code.
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm exec biome check .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: One unit per file
        run: node scripts/check-single-export.mjs --check

      - name: Schema depth
        run: node scripts/check-schema-depth.mjs --check

      - name: Package boundaries
        run: pnpm boundaries

      - name: Duplication
        run: pnpm dupes

      - name: Dead code
        run: pnpm knip

      - name: Type coverage
        run: pnpm type-coverage

      # The three gates that read the artifact a consumer would install, rather than the
      # source. They ran in `pnpm verify` and in no automated job, so nothing on a pull
      # request exercised them.
      - name: Publishable
        run: pnpm publishable

      # A runner has no skills installed, so the comparison against disk cannot run here. What
      # this catches is a commit that edits the lockfile into something nothing can reinstall
      # from — it parses, and every entry carries the fields a reinstall reads.
      - name: Skills lockfile is usable
        run: pnpm skills-lock
