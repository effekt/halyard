name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every gate here is plain Node with no dependencies, so it runs against a bare
  # checkout with no install step and no lockfile. They are also the only gates with
  # anything to check until the first package lands — see the Status section in README.md.
  #
  # check-schema-depth and check-single-export are absent despite also being scripts:
  # both import `typescript`, so they run in the code job below alongside the gates
  # that need node_modules.
  #
  # The code gates (biome, typecheck, test, boundaries) join this file in the commit that
  # adds the first package, together with the lockfile they need. They are deliberately
  # absent rather than skipped: a job that cannot run is better left unwritten than
  # written and disabled.
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check-stale-docs compares commit times across link edges, so it needs history.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Documentation structure
        run: node scripts/check-docs.mjs --check

      # The denylist is gitignored — publishing it would defeat it — so this run catches
      # machine paths only. VENDOR_TERMS supplies the terms when the secret is configured.
      - name: Vendor references
        run: |
          if [ -n "$VENDOR_TERMS" ]; then
            printf '%s\n' "$VENDOR_TERMS" > scripts/vendor-terms.txt
          fi
          node scripts/check-no-vendor-refs.mjs --check
        env:
          VENDOR_TERMS: ${{ secrets.VENDOR_TERMS }}

      - name: Prose
        run: node scripts/check-prose.mjs --check

      - name: Accessibility
        run: node scripts/check-a11y.mjs --check

      - name: Rule files
        run: node scripts/check-rules.mjs --check

      - name: Pinned dependencies
        run: node scripts/check-pinned-deps.mjs --check

      - name: Junk-drawer filenames
        run: node scripts/check-structure.mjs --check

      # Advisory: a document trailing something it links to is worth re-reading,
      # not worth failing a build over.
      - name: Stale documents
        run: node scripts/check-stale-docs.mjs
        continue-on-error: true

  # Everything needing an install. Absent while no package existed; a lockfile, a demo
  # application that builds, and TypeScript that typechecks all arrived without this
  # job arriving with them, so main could have broken while CI stayed green.
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm exec biome check .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: One unit per file
        run: node scripts/check-single-export.mjs --check

      - name: Schema depth
        run: node scripts/check-schema-depth.mjs --check

      - name: Package boundaries
        run: pnpm boundaries

      - name: Duplication
        run: pnpm dupes

      - name: Dead code
        run: pnpm knip
