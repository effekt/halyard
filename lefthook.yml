# https://github.com/evilmartians/lefthook
min_version: 2.1.6
lefthook: pnpm exec lefthook

pre-commit:
  parallel: false
  commands:
    fix:
      glob: "*.{js,mjs,ts,tsx,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # One unit per file — counts value exports AND module-private functions.
    # Biome's filenameCases:["export"] checks the NAME; this checks the COUNT.
    # Pre-commit only, never CI: it blocks the commit that touches a file, so the
    # author decomposes what they are already editing.
    single-export:
      glob: "{packages,apps}/**/*.{ts,tsx}"
      run: node scripts/check-single-export.mjs --check {staged_files}

    junk-filenames:
      glob: "{packages,apps}/**/*.{ts,tsx}"
      run: node scripts/check-structure.mjs --check {staged_files}

    # A large schema is one declaration with no branching, so every complexity gate
    # scores it zero. This is the only thing that catches it.
    schema-depth:
      glob: "{packages,apps}/**/*.{ts,tsx}"
      run: node scripts/check-schema-depth.mjs --check {staged_files}

    # Corpus-wide, so no {staged_files}. The threshold is a ratio, and a ratio over
    # whatever happens to be staged is not a measurement: ten small files sharing one
    # function signature exceed 1% of themselves while being 0.88% of the repository.
    duplication:
      glob: "{packages,apps}/**/*.{ts,tsx}"
      run: pnpm dupes

    # Nobody on the team reports an accessibility defect, because the person who can
    # see it is the one who cannot use the page. It has to be caught at the edit.
    accessibility:
      glob: "*.{tsx,jsx,html,css}"
      run: node scripts/check-a11y.mjs --check {staged_files}

    # Ranges auto-install unreviewed code; minimumReleaseAge only delays it.
    pinned-deps:
      glob: "**/package.json"
      run: node scripts/check-pinned-deps.mjs --check {staged_files}

    # Corpus-wide: whether a peer is used depends on source files, not on the manifest that
    # declares it, so a staged-manifest run would answer the wrong question.
    peer-deps:
      glob: "**/package.json"
      run: pnpm peer-deps

    # Public repo, contributors from private ones. `*` beat an extension list: a list is
    # narrower than the sweep it fronts, the scanner skips binaries itself, and every staged
    # file goes to one node invocation, so the width costs nothing.
    vendor-refs:
      glob: "*"
      run: node scripts/check-no-vendor-refs.mjs --check {staged_files}

    # Corpus-wide, so no {staged_files}: a link is only broken relative to every
    # other document.
    docs:
      glob: "*.md"
      run: node scripts/check-docs.mjs --check

    # Corpus-wide like docs: a filename in one document may name a file another commit moved.
    file-refs:
      glob: "*.md"
      run: node scripts/check-file-refs.mjs --check

    # Per-file, unlike the two above: an unciteable measurement or a filler phrase is
    # wrong on its own line, with no reference to the rest of the corpus.
    prose:
      glob: "*.md"
      run: node scripts/check-prose.mjs --check {staged_files}

    # Corpus-wide, like docs: a claim is a duplicate only relative to where else it is
    # written, and the second copy is as often in the file nobody staged.
    prose-dupes:
      glob: "*.md"
      run: pnpm run prose-dupes

    # A plan committed as a file has no close condition, so nothing ever deletes it.
    plan-files:
      glob: "docs/**/*.md"
      run: node scripts/check-plan-files.mjs --check {staged_files}

    # A rule file is re-read on every matching edit, so its length is a running cost.
    rule-files:
      glob: ".claude/rules/*.md"
      run: node scripts/check-rules.mjs --check {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
    boundaries:
      run: pnpm boundaries
    dead-code:
      run: pnpm knip
    stale-docs:
      run: pnpm stale-docs
    type-coverage:
      run: pnpm type-coverage
    # Pre-push, not pre-commit: installing a skill and forgetting to record it stages
    # nothing, so there is no file the commit hook could glob on.
    skills-lock:
      run: pnpm skills-lock
