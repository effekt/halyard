# https://github.com/evilmartians/lefthook
min_version: 2.1.6
lefthook: pnpm exec lefthook

# A glob here is not decoration: lefthook filters `{staged_files}` by it AND skips the command
# outright when nothing staged matches, whether or not the command interpolates them. Proven on
# 2.1.10 — `lefthook run pre-commit --command docs --file package.json` reported
# `docs (skip) no matching staged files`. So a corpus-wide command still wants a glob: it says
# which edits are worth paying for, and without one it runs on every commit.
pre-commit:
  parallel: false
  commands:
    fix:
      glob: "*.{js,mjs,ts,tsx,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # The whole repository suite, not `vitest related`. These assertions read files as *data*
    # rather than importing them, so `related` selects none of them for any staged file — the
    # selection would be empty and the run would be a tick over nothing. The `repo` project is
    # milliseconds; `release` is not, and runs from `pnpm publishable` instead.
    repo-suite:
      glob: "*.{ts,tsx,mjs,md,json,jsonc,yml,yaml}"
      run: pnpm exec vitest run --project repo

    # Nobody on the team reports an accessibility defect, because the person who can see it is
    # the one who cannot use the page. It has to be caught at the edit.
    accessibility:
      glob: "*.{tsx,jsx,html,css}"
      run: node scripts/check-a11y.mjs --check {staged_files}

    # Per-file, unlike the suite above: an unciteable measurement or a filler phrase is wrong on
    # its own line, with no reference to the rest of the corpus.
    prose:
      glob: "*.md"
      run: node scripts/check-prose.mjs --check {staged_files}

    # Ranges auto-install unreviewed code; minimumReleaseAge only delays it. Corpus-wide because
    # a manifest's specifier is only exact relative to the catalog it resolves through.
    pinned-deps:
      glob: "{package.json,**/package.json,pnpm-workspace.yaml}"
      run: pnpm pinned-deps

    # Corpus-wide, so no {staged_files}. The threshold is a ratio, and a ratio over whatever
    # happens to be staged is not a measurement: ten small files sharing one function signature
    # exceed 1% of themselves while being 0.88% of the repository.
    duplication:
      glob: "{packages,apps}/**/*.{ts,tsx}"
      run: pnpm dupes

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
    boundaries:
      run: pnpm boundaries
    dead-code:
      run: pnpm knip
    type-coverage:
      run: pnpm type-coverage

    # Reports and cannot fail: it reads the primary worktree, which the person pushing from a
    # linked one may not own. Pre-push rather than pre-commit because a stray artifact is worth
    # one look before the work leaves the machine, not one on every commit.
    primary-tree:
      run: pnpm run primary-tree
